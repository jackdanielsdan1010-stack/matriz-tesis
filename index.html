El enfoque propuesto elimina en gran parte las limitaciones de los ecualizadores tradicionales que ayuda a generar arquitecturas más flexibles e inteligentes para futuras redes de comunicación inalámbrica.`,
references:`Wu, D., Nekovee, M., & Wang, Y. (2020). Deep learning-based autoencoder for m-user wireless interference channel physical layer design. IEEE Access, 8, 174679–174691. https://doi.org/10.1109/ACCESS.2020.3025597`,
url:"https://ieeexplore.ieee.org/document/9204706"
            },
{
                id:44,
                category:"Deep Learning",
                title:"Secret Key Generation Driven by Attention-Based Convolutional Autoencoder and Quantile Quantization for IoT Security in 5G and Beyond",
                aiTech:"Autoencoders",
problem:`Las redes IoT y el 5G han tenido un gran crecimiento y han expuesto desafíos de seguridad importantes, los dispositivos tienen un consumo energético limitado que hace no hace factible el uso de métodos criptográficos, Por ello llega el PSKG (Physical-Layer Secret Key Generation) una alternativa que explora la aleatoriedad y reciprocidad de los canales inalámbricos para establecer comunicaciones seguras pero en sistemas TDD (Time-Division Duplex), las imperfecciones del sistema y el ruido dañan la compensación del canal y desgastan la generación de claves.`,
methodology:`Se propuso un esquema de PSKG (Physical-Layer Secret Key Generation) junto con redes neuronales donde los usuarios permitidos intercambian señales de referencia para estimar el CSI, un modelo DL retira las características del canal para reducir el ruido. Las características obtenidas pasan por un esquema de cuantización basado en cuantiles los cuales calculan los intervalos con una función de distribución acumulativa que mejora la uniformidad de las claves generadas.
Para la validación del sistema se construyeron una arquitectura 5G con distintos perfiles de retraso, desplazamientos Doppler y niveles de SNR que simulaba a los usuarios y a los atacantes. Por ultimo se agrega una reconciliación de claves sin codificación y una etapa de amplificación de privacidad en base a funciones criptográficas de resumen que evita fugas de información.`,
aiUsage:`El uso de la IA se basa en un autoencoder 2D CNN-AE (Two-Dimensional Convolutional Neural Network Autoencoder) con un mecanismo de autoatención espacial SSA (Spatial Self-Attention) en el que el modelo recibe la información del canal en formato de una cuadrícula espacio-temporal y procesa de forma separada las componentes reales e imaginarias de la señal, en la codificación las capas convolucionales extraen patrones relevantes y reducen la dimensionalidad de forma progresiva hasta formar un espacio latente y compacto.
El mecanismo SSA dentro del espacio latente calcula los pesos dinámicos entre tensores de consulta, clave y valor para recalcar las características espaciales más correlacionadas y para atenuar el ruido. Por ultimo en la fase de decodificación se reconstruye la información original utilizando capas de sobremuestreo y convoluciones transpuestas que reducen el error cuadrático medio para tener una estimación del canal limpia y precisa.`,
findings:`El modelo propuesto resulto ser superior a otros enfoques ya que logro una precisa extracción de características espaciales hasta en escenarios con baja relación señal a ruido, el mecanismo de atención redujo la tasa de desacuerdo de claves KDR (Key Disagreement Ratio) ajustando los perfiles de canal entre los usuarios legítimos y dificulta el espionaje de los atacantes.
El sistema tuvo una mayor tasa de generación de claves KGR reduciendo en un promedio de 88 y 93% el número de parámetros y memoria necesaria en comparación a otros modelos que lo hace útil para microcontroladores y las claves generadas tuvieron un 99% de confianza en pruebas de aleatoriedad y entropía del NIST (National Institute of Standards and Technology).`,
conclusions:`El uso de un autoencoder convolucional con mecanismos de atención espacial es una una solución ligera para fortalecer la seguridad de la capa física en redes IoT ya que corrige de forma algorítmica las alteraciones del medio inalámbrico y las imperfecciones del sistema.
Se garantizo una distribución homogénea con una cuantización por cuantiles en donde el modelo consigue descargar parte de la carga que se asocia a la criptografía en redes de nueva generación.`,
references:`Alashqar, A., Torshizi, E. O., Mesleh, R., & Henkel, W. (2025). Secret key generation driven by attention-based convolutional autoencoder and quantile quantization for IoT security in 5G and beyond. IEEE Access, 13, 131744–131756. https://doi.org/10.1109/ACCESS.2025.3590926`,
url:"https://ieeexplore.ieee.org/document/11086605"
            },
{
                id:45,
                category:"Federated Learning",
                title:"A Federated Autoencoder Framework With Explainable AI for Intelligent 6G-IoT Infrastructure Optimization.",
aiTech:"Autoencoders",
problem:`Las redes 6G buscan una velocidad de transmisión en el  orden de terabits por segundo, una gran conectividad y latencias ultrabajas, el problema esta en que los métodos actuales dependen de esquemas centralizados que peligranla privacidad de los datos, o de sistemas que no pueden ajustar el dinamismo del canal de radiofrecuencia. El modelo FL (Federated Learning) ayuda a reducir las fugas de información manteiendo los datos en los nodos de borde pero este modelo no ofrece la interpretabilidad suficiente que exigen los nuevos marcos regulatorios de IA por si solo, como por lo cual surgue el desafío de implementar una infraestructura inteligente que pueda ser capaz de optimizar los parámetros de calidad de servicio que sea adaptables y descentralizados.`,
methodology:`Se plantea un procesamiento de señales empezando con una normalización estadística de un conjunto de datos de gestión inteligente de una infraestructura 6G-IoT de más de 7.000 registros y 15 metricas técnicas aplicando una sustracción de la media poblacional dividida por la desviación estándar en cada vector que evita técnicas de sobremuestreo por la homogeneidad de las clases capturadas, las muestras son divididas 80% para el entrenamiento y 20% para validadciones distribuidas entre 3 clientes que imitan las limitaciones reales de procesamiento y espectro originales de entornos perimetrales permitiendo simbolizar de forma realista los cuellos de botella de los escenarios 6G.
Se implementa una estrategia multiobjetivo de minimización y maximización de los parámetros físicos con lo cual la función de pérdida sanciona los incrementos no deseados en la latencia de extremo a extremo y en la pérdida de paquetes IP y recompoensa las mejoras en el rendimiento de la transmisión y en el caso de los dispositivos IoT recompensar su eficiencia energetica
Para la validación se agregan pruebas estadísticas como la T pareada que es utilizada para analizar las diferencias entre variables críticas del canal como retardos y capacidad de transferencia, para el rendimiento inferencial se utilizaron métricas como exactitud, precisión positiva, exhaustividad, F1 y ROC-AUC (Receiver Operating Characteristic Area Under Curve) para medir que el sistema cumpla con las exigencias de la UIT.`,
aiUsage:`Se implemento un VAE (Variational Autoencoder) especialmente para la reducir las variables operativas de la infaestructura 6G IoT, la red codificadora transforma la información en representaciones probabilísticas con una reducción en la complejidad espacial, luego un sistema de decodificación trata de reconstruir la matriz original reduciendo el error de reconstrucción y una medida de divergencia probabilística que promueve la generalizacion.
El modelose evalúa junto a técnicas de ML como DT (Decision Trees), RF (Random Forest), LR (Logistic Regression), GB (Gradient Boosting) y AdaBoost, donde RF tuvo mejroes resultados por su semejanza con mecanismos de validación interpretativa.
Todos los clasificadores presentados fueron añadidos bajo un esquema FL, donde cada dispositivo tiene un entrenamiento local de sus modelos que los hace optimos en sus funciones de costo y solo envía actualizaciones de parámetros hacia un nodo central que promedia de forma algbraica los gradientes hasta completar el límite de iteraciones. 
Se utiliza una técnica de XAI (Explainable AI) mediante SHAP (Shapley Additive Explanations) y LIME (Local Interpretable Model-agnostic Explanations) donde SHAP calcula el peso de influencia de cada atributo con una evaluación de los subconjuntos de características, LIME produce perturbaciones para interpretar predicciones individuales con lo que el sistema puede controlar las decisiones que fueron tomadas y verificar que las priorizaciones del enlace respondan a fenómenos físicos reales.`,
findings:`El algoritmo Gradient Boosting tuvo una exactitud en la predicción del 99.8% en una validación cruzada de 10 iteraciones mientras que Random Forest obtuvo un ROC-AUC de 0.995 es decir un nivel de confiabilidad alto, en cambio el VAE tuvo una exactitud muy cercana al 88% que su aporte esta relacionado con la reducción de ruido y compresión de metadatos.
En el esquema FL se alcanzó un ROC-AUC de 0.999 y una exactitud del 97.5% en la clasificación de tareas inteligentes que muestran una gran capacidad para ser utilizada en escenarios industriales.
Las herramientas de explicabilidad reflejan que los retardos temporales y el caudal máximo del canal son los factores más importantes en la estabilidad o colapso de la red.`,
conclusions:`Combinar FL, autoencoders probabilísticos y mecanismos de explicabilidad forman una base sólida para administrar las redes 6G asistidas por IoT de forma dinámica, el enfoque mejora métricas relacionadas con transmisión y estabilidad y responde a las exigencias regulatorias relacionadas con privacidad y trazabilidad algorítmica.`,
references:`Nallakaruppan, M. K., et al. (2026). A federated autoencoder framework with explainable AI for intelligent 6G-IoT infrastructure optimization. IEEE Internet of Things Journal, 13(5), 8003–8010. https://doi.org/10.1109/JIOT.2025.3606232`,
url:"https://ieeexplore.ieee.org/document/11151633"
            },
{
                id:46,
                category:"Federated Learning",
                title:"Federated Deep Reinforcement Learning for ENDC Optimization.",
aiTech:"Multiple",
problem:`Los primeros despliegues de las redes 5G trabajan bajo el modo NSA (Non-Stand Alone), habilitando la arquitectura ENDC (E-UTRAN New Radio Dual Connectivity) en la que los equipos de usuario se conectan al mismo tiempo a la tecnologia LTE como a la 5G. El problema esta en que algunos dispositivos pueden conectarse al 5G pero con una mala calidad en la señal debido a los consumos de la red y no pueden ser aprovechados de manera eficiente, esto hace que aumente la tasa de llamadas caídas y genera un equilibrio entre aumentar la capacidad total de la red y reducir las desconexiones. El evento B1 se encarga de activar la conexion dual.`,
methodology:`Se intenta resolver la carga computacional dividiendo el entrenamiento en múltiples entornos aislados mediante un simulador de red, se distribuye el proceso creando agentes independientes en distintas celdas, cada agente solo modifica el valor del umbral B1 de su propia celda mientras el resto de parámetros como potencia o inclinación de antena quedan intactos co lo que el sistema reduce el número de combinaciones posibles.
Un esquema de FL opera en 4 etapas repetitivas, lo primero es cada agente entrena localmente utilizando estados y recompensas de su entorno, después solo se comparten parámetros y gradientes aprendidos, le sigue un nodo central que une el conocimiento mediante FL Horizontal y por ultimo redistribuye el modelo actualizado hacia las radiobases, lo que continua hasta que la pérdida Huber tenga un margen aceptable.
Las recompensas consideran el rendimiento agregado de todas las celdas cercanas, con lo que el modelo percibe las dinámicas inherentes de la red y el impacto en la carga de las celdas vecinas.`,
aiUsage:`Bajo un esquema FDRL y un modelo de DNN (Deep Neural Network) basada en Q-learning, la red neuronal dividida en 3 capas ocultas de 128 neunronas optimizada mediante Adam, el sistema utiliza un tensor normalizado entre 0 y 1 que reúne 7 variables como el valor del evento B1, la carga de la celda, el CQI, la potencia, la inclinación de antena y métricas de carga y calidad espectral de las 4 celdas vecinas.
Frente a esto la IA puede ejecutar 3 acciones posibles por iteración, aumentar, disminuir un decibelio o mantener el valor actual, lo que ayuda a estabilizar el comportamiento del sistema frente a fluctuaciones del entorno móvil a pesar de ser una restricción simple.
El modelo utiliza una función de utilidad que recompensa a los usuarios con altas tasas efectivas de transferencia y penaliza las desconexiones provocadas por niveles insuficientes de RSRP o RSRQ, el equilibrio entre exploración y explotación es contolado mediante un mecanismo épsilon-avaro decreciente que permite a la red explorar al inicio y luego se estabilice progresivamente e igual incorpora un factor de descuento de 0.9 y un búfer de repetición de experiencias de 700 pasos que es algo importante para evitar inestabilidad y caidas en el aprendizaje.`,
findings:`El modelo FL rescata escenarios que eran inestables, alcanzando una mejora en el rendimiento global de datos y reduce las desconexiones, otro hallazgo es que el rendimiento de la red no es un valor único de umbral B1 para todas las celdas sino que es una combinación de distintos valores para cada celda dentro de un rango que va desde -115 dBm hasta -123 dBm
El esquema propuesto supera a RL ya que este modelo no puede manejar el ruido cruzado multicelda.
El equema FL mostró una gran capacidad para adaptarse a nuevos escenarios que tienen una disposición diferente de clústeres y distinto número de celdas sin la necesidad de un proceso de reentrenamiento.`,
conclusions:`La investigación concluye que el FL es una alternativa sólida para parametrizar de forma dinamica los umbrales de conectividad en los escenarios ENDC.
Dividir el aprendizaje en muchos agentes permite construir un sistema estable y adaptable que es capaz de equilibrar de manera independiente la capacidad de tráfico y la confiabilidad de la red frente a cambios del entorno móvil.`,
references:`A. Martin, I. de-la-Bandera, A. Mendo, J. Outes, J. Ramiro and R. Barco, "Federated Deep Reinforcement Learning for ENDC Optimization," in IEEE Transactions on Mobile Computing, vol. 24, no. 6, pp. 5525-5535, June 2025, doi: 10.1109/TMC.2025.3534661.`,
url:"https://ieeexplore.ieee.org/document/10854899"
            },
{
                id:47,
                category:"Federated Learning",
                title:"Adaptive Beam Tracking in 5G/6G mmWave Networks: A Clustered Federated Learning Approach.",
aiTech:"Multiple",
problem:`El uso de bandas mmWave en redes 5G y 6G ahora es escencial para sostener las grandes demandas en el tráfico y la velocidad de transmisión, estas señales de alta frecuencia son muy frágiles a los bloqueos físicos y pérdidas por propagación. Debido a esto se necesitan de antenas de formación de haces y mecanismos de seguimiento dinámico que ajustan de manera continua la dirección de transmisión y recepción mientras los dispositivos están en movimiento. El problema esta cuando los métodos de ML dependen del CL (Centralized Learning) debido a su enorme carga computacional y riesgos de privacidad por el gran envío de datos hacia un nodo central. Por ello se plantea la alternativa del FL ya que defiende de mejor manera la información local aunque pierde precisión y velocidad de convergencia cuando los datos son heterogéneos o no IID (Non-Independent and Identically Distributed).`,
methodology:`Se empieza utilizando el método SBR (Shooting and Bouncing Ray) que recrea trayectorias e interacciones urbanas complejas, durante las simulaciones la estación base agrega un gran arreglo de antenas de 32x32 elementos donde los equipos del usuario (UE) utilizan configuraciones compactas de 4x4 antenas, el sistema captura parámetros del canal como el AoA (Angle of Arrival), el AoD (Angle of Departure) y la pérdida de trayectoria en los desplazamientos peatonales y vehiculares.
Para evitar la perdida de la información relacionada al multitrayecto, los rayos recolectados son reorganizados en clústers espaciales emplenado resoluciones angulares de azimut y elevación. 
Se desarrollo el algoritmo CFL (Clustered Federated Learning) donde los dispositivos son agrupados tomando en cuenta factores relacionados con el canal como el tipo de movilidad ya sea peatonal o vehicular y la ubicación geográfica de la ruta que vuelve más homogéneas las distribuciones locales y hace que el entrenamiento sea más estable y adaptativos en cada clúster.
La sistema opera en 2 etapas, primero la estación base transmite señales piloto para que los usuarios afinen sus estimaciones de canal, después aprovecha la correlación temporal del entorno que hace que la cantidad de pilotos se reduzca en gran medida y los modelos empiezan a predecir estados futuros del canal con lo que se disminuye la latencia y la sobrecarga de señalización.`,
aiUsage:`La IA al ser el centro predictivo del sistema trabaja bajo una arquitectura basada en bloques ConvLSTM (Convolutional Long Short-Term Memory), el cual recibe secuencias históricas del canal ordenadas en tensores multidimensionales que son procesadas usando capas ConvLSTM diseñadas para extraer patrones espacio-temporales ocultos dentro de las trayectorias de propagación.
Para la estabilización las capas utilizan funciones de activación de tangente hiperbólica con una normalización que reduce las variaciones inestables y aceleran la convergencia, se agrega una capa de abandono estocástico del 50% para evitar sobreajuste y para terminar se hace una convolución tridimensional para estimar el estado futuro del canal.
Para la descentralziacion en el entrenamiento se utiliza el esquema CFL en el cual la estación base ejecuta una distribución no supervisada para organizar de forma ordenada los dispositivos en clústers, con esto cada usuario realiza iteraciones locales de descenso de gradiente estocástico con sus propios datos que hace que se minimice el error cuadrático medio en la predicción.
Por ultimo los equipos transmiten las actualizaciones de pesos del modelo a la estación base donde se aplica una promediación federada calificada según el volumen de datos de cada usuario en el cual el resultado es un modelo independiente para cada clúster que respeta la privacidad de la información local.`,
findings:`El esquema CFL es superior al CL y al FL en escenarios urbanos donde prevalecen los ecos y el multitrayecto, el modelo obtuvo una precisión del 92% con solo 10 rondas de entrenamiento.
La pruebas en escenarios rurales con mejores condiciones de línea de vista tuvo una precisión del 96% y a pesar de que el entrenamiento local requiere una carga computacional considerable, la agrupación inteligente de usuarios reduce el número de rondas necesarias disminuye la latencia y la sobrecarga.`,
conclusions:`El FL basado en clústers es una solución muy sólida para el seguimiento y alineación de haces en bandas milimétrica equilibrando la precisión predictiva, privacidad y eficiencia de señalización.
Agrupar usuarios con comportamientos de canal similares puede mejorar la convergencia y la estabilidad de los modelos distribuidos en redes móviles avanzadas.`,
references:`Ali, A., & Koucheryavy, Y. (2025). Adaptive beam tracking in 5G/6G mmWave networks: A clustered federated learning approach. IEEE Access, 13, 70705–70720. https://doi.org/10.1109/ACCESS.2025.3563435`,
url:"https://ieeexplore.ieee.org/document/10973052"
            },
{
                id:48,
                category:"Federated Learning",
                title:"Federated Deep Reinforcement Learning for Prediction-Based Network Slice Mobility in 6G Mobile Networks.",
aiTech:"Multiple",
problem:`En las redes 6G el network slices enfrenta algunos problemas de continuidad en el servicio y disponibilidad de recursos por la movilidad constante de los usuarios y por las variaciones de sus solicitudes, el NSM (Network Slice Mobility) intenta resolverlo mediante migración de servicios y reasignación de recursos donde muchos enfoques siguen tomando decisiones sin tener que anticipar el comportamiento futuro del sistema ni detectar anomalías. Los modelos de DRL trabajan con observaciones incompletas del entorno que genera recompensas inestables y entrenamientos poco eficientes.`,
methodology:`La investigación implementa el proceso de NSM periódicamente asumiendo que las anomalías que causan la migración pasan al inicio de cada período temporal, la arquitectura de red fue descentralizando la red central con funciones de red virtuales o VNFs (Virtual Network Functions) organizada en servidores ESs (Edge Servers) bajo un paradigma de red Open-RAN, esto permite dividir el proceso operativo en fases de inicialización, recolección de métricas y migración estratégica en donde los agentes de cada VNF observan la demanda actual y la disponibilidad de recursos físicos en los diferentes nodos.
El problema de decisión de NSM periódico se transforma en un proceso de decisión MDP (Markov Decision Process) con el objetivo matemático de maximizar el beneficio a largo plazo de los operadores de redes móviles en el que el beneficio general del sistema se califica restando los costos operativos a los ingresos generados en donde la cuantificación de los costos sale de la sumatoria del precio de ejecución de los recursos consumidos, las penalizaciones multiplicativas por recursos no satisfechos debido a picos de demanda y los castigos por la migración física de las VNFs entre servidores en cambio los ingresos de las operadoras se calculan con los recursos que fueron efectivamente provistos, el nivel de prioridad inherente a las peticiones de los distintos usuarios y los límites de latencia garantizados por los acuerdos de nivel de servicio.
Por ultimo se integra una predicción del comportamiento de los usuarios mediante aprendizaje computacional distribuido, al calcular de forma matemática y anticipada las trayectorias topológicas y las cuotas de demanda futuras que es añadida al espacio de estado del MDP para alimentar la toma de decisiones que garantiza que el agente asigne capacidades de cómputo y enrutamiento preventivamente.`,
aiUsage:`La IA es implementada en un módulo de predicción LSTM (Long Short-Term Memory) y un módulo de decisión DDQN (Double Deep Q-Network) sincronizados bajon un modelo FL, las redes neuronales LSTM procesan vectores históricos compuestos por coordenadas geográficas y volúmenes de recursos registrados en los ESs, esto logra eludir las caídas de gradiente exponencial al retener dependencias largas mediante sus compuertas internas de activación. Cada VNF entrena el modelo LSTM individualmente minimizando el error cuadrático medio entre las inferencias de prueba y las coordenadas reales capturadas ajustando los pesos sinápticos con el método de propagación hacia atrás y el algoritmo optimizador Adam (Adaptive Moment Estimation).
El módulo DDQN reune los tensores de salida del modelo LSTM para ensamblar su espacio de estado continuo que encapsula la matriz de recursos disponibles en las estaciones base, el consumo actual en tiempo real y las posiciones proyectadas para múltiples ranuras de tiempo futuras. La función de decisión del agente se define como la selección discreta del nodo de borde de destino óptimo para instanciar la VNF mientras que para estabilizar la red se extrae de la ganancia financiera total calculada al cierre de la época de migración completa. Para eliminar el sesgo de sobreestimación la arquitectura DDQN divide su cálculo en 2 redes neuronales profundas independientes, una red principal iterativa y una red objetivo estable que actualizan los parámetros reduciendo gradientes de error apoyándose en experiencias pasadas bajadas de un búfer de repetición y por ultimo el FDRL envía los tensores de parámetros de las DDQN locales hacia la nube para un promedio iterativo.`,
findings:`El modelo LSTM y los agentes DDQN superan a las arquitecturas tradicionales que en comparación con sistemas DRL que trabaja sin tomar en tiempo el futuro, el enrutador predictivo propuesto puede eliminar métricas de penalidad por falta de recursos y reduce el espectro de costos operacionales de los servidores que a la vez maximiza el índice de facturación promedio y da una retención de ganancias a largo plazo.
El modelo comprobó que acoplar la topología de FL elimina las limitaciones por ancho de banda en comparación con esquemas centralizados tradicionales, las gráficas aseguran que el esquema distribuido hunde la huella de tráfico de datos de los procesos de entrenamiento hasta en un 71% acelerando la velocidad en las ventanas de tiempo de transmisión.`,
conclusions:`Observar de forma periódica la movilidad del Network Slicing y combinarlo con modelos de análisis de series temporales ayuda a resolver el problema de las observaciones incompletas que afecta al RL.
El esquema FDRL fortalece la operación de plataformas 6G multicapa mejorando la eficiencia computacional, reduciendo la latencia y protegiendo la privacidad de la información de los usuarios.`,
references:`Ming, Z., Yu, H., & Taleb, T. (2024). Federated deep reinforcement learning for prediction-based network slice mobility in 6G mobile networks. IEEE Transactions on Mobile Computing, 23(12), 11937–11953. https://doi.org/10.1109/TMC.2024.3404125`,
url:"https://ieeexplore.ieee.org/document/10536643"
            },
{
                id:49,
                category:"Federated Learning",
                title:"A Federated Reinforcement Learning Framework for Incumbent Technologies in Beyond 5G Networks.",
aiTech:"Multiple",
problem:`La integración de tecnologías WLAN con redes 5G y B5G es fundamental porque gran parte del tráfico móvil de la actualidad proviene de dispositivos WIFI pero cuando la cantidad de usuarios aumenta también aumenta las colisiones y escasez de recursos de canal y es que muchos de los métodos actuales de acceso al medio adaptan los parámetros de contención sin ver, lo que provoca una degradación en el rendimiento de la red. Los enfoques RL intentan solucionar este problema pero dependen de estimaciones locales individuales que generan errores variables en escenarios inalámbricos.`,
methodology:`Se propone un esquema de FRL con un enfoque en optimizar los parámetros de acceso al medio dentro de la capa MAC en redes ultradensas combinado con un modelo FL y RL bajo un entorno MDP (Markov Decision Process) donde las estaciones trabajan como agentes autónomos de aprendizaje y los estados representan las etapas de retroceso de la red, el diseño de esta arquitectura evita que cada estación aprenda de forma aislada y reduce la varianza de error sin necesidad de compartir datos reales de los usuarios.
Un access point coordina el proceso de aprendizaje de todas las estaciones, en el que cada una observa de manera continua las ranuras de tiempo del canal para encontrar si están libres o si están ocupadas con el fin de estimar una probabilidad de colisión con sus recompensas inmediatas y en lugar de transferir muchos datos que aumentarían la latencia cada estación encapsula localmente su información de aprendizaje dentro de un mensaje FACK (Federated Acknowledgment).
El Access point organiza las estimaciones locales utilizando un esquema DQL (Double Q-Learning) para implementar un GLM (Global Learning Model), el conocimiento regresa a las estaciones y ajustan sus ventanas de contención en combinación con el aprendizaje local y con la inteligencia de la red.`,
aiUsage:`La IA se encarga de transformar cada dispositivo en un agente capaz de maximizar recompensas acumuladas a largo plazo mediante valores Q, donde el agente actualiza su conocimiento con recompensas inmediatas, predicciones futuras y factores de descuento temporal que permiten adaptarse al entorno inalámbrico, el sistema tiene un equilibrio con la exploración de nuevas decisiones y el aprovechamiento del conocimiento ya aprendido calificando el éxito de las transmisiones contra las probabilidades reales de colisión.
El aprendizaje es implementado en el proceso de actualización de los valores Q, en el cual en vez de depender solo de estimaciones locales cada estación reemplaza parte de sus predicciones futuras con el valor Q federado recibido mediante los mensajes FACK y obliga al sistema a trabajar con experiencias distribuidas dentro de la red que hace una reducción de la sobreestimación típica de Q-Learning y permite que las estaciones mucho más precisas y equilibradas.`,
findings:`Entre los resultados de las simulaciones se puede decir que la propuesta FIQRA (Federated intelligent Q-Learning-based Resource Allocation) unifica mucho más rápido que algoritmos RL con lo cual las estaciones pueden adaptarse al entorno de radiofrecuencia casi en tiempo real y aprovecha el doble estimador para disminuir la variabilidad de las decisiones locales.
El protocolo MAC mejoró notablemente el throughput de la red ya que mantuvo un rendimiento estable hasta en ocasiones cuando muchas estaciones intentaban acceder al canal de forma simultánea.`,
conclusions:`El modelo FRL es una gran solución para la asignación de recursos y la reducción de colisiones en redes 5G y B5G ultradensas, al compartir únicamente métricas de aprendizaje y al no compartir información privada de los usuarios el sistema logra mejorar la estabilidad de la red sin tener que arriesgar la seguridad o privacidad.`,
references:`Ali, R., Zikria, Y. B., Garg, S., Bashir, A. K., Obaidat, M. S., & Kim, H. S. (2021). A federated reinforcement learning framework for incumbent technologies in beyond 5G networks. IEEE Network, 35(4), 152–159. https://doi.org/10.1109/MNET.011.2000611`,
url:"https://ieeexplore.ieee.org/document/9520344"
            },
{
                id:50,
                category:"Reinforcement Learning",
                title:"Intelligent Resource Allocation via Hybrid Reinforcement Learning in 5G Network Slicing.",
aiTech:"Multiple",
problem:`Las redes móviles basadas en network slicing enfrentan un gran desafío dentro de la RAN el cual es equilibrar servicios eMBB (Enhanced Mobile Broadband) con un enfoque en altas velocidades con servicios URLLC (Ultra-Reliable Low Latency Communication) que necesitan latencias extra bajas y de gran confiabilidad.
El buscar mejorar el rendimiento para un servicio sabe afectar de forma negativa la experiencia y la capacidad general de la red que crea un problema complejo que los métodos tradicionales no consiguen resolver de manera eficiente.`,
methodology:`El planteamiento fue en base a una función de optimización múltiple encaminada en maximizar el nivel de satisfacción de los usuarios eMBB y la experiencia global de la red, se añade un coeficiente de atención dinámico que hace ajustes continuamente en el equilibrio de las métricas según las variaciones del tráfico en tiempo real, trabaja en cada bloque de los recursos físicos asignados en un solo usuario y las latencias de URLLC deben mantenerse dentro de límites reducidos, los usuarios eMBB necesitan tasas mínimas garantizadas y la estación base no puede exceder el límite energético de operacion.
Se opto por un enfoque basado en RL, donde el controlador de la RAN actúa como un agente autónomo que aprende directo del entorno inalámbrico, el estado del sistema es construido utilizando la relación señal-interferencia-ruido que tienen los usuarios conectados mientras que las acciones corresponden a la asignación de bloques espectrales y niveles de potencia de transmisión.
La solución complemntaria esta dividida en 2, primero un agente principal explora distintas configuraciones de asignación y almacena experiencias críticas en un búfer de memoria priorizada, segundo esas decisiones alimentan una red neuronal diseñada para capturar variaciones temporales del tráfico y refinar gradualmente las políticas de asignación con un mecanismo de atención que optimiza las decisiones finales.`,
aiUsage:`Se implemento una arquitectura con una topología híbrida que integra DDQN-PER (Double Deep Q-Network con Prioritized Experience Replay) y PtrNet-LSTM (Pointer Network basada en Long Short-Term Memory), El DDQN-PER se encarga de eliminar la sobreestimación de valores de acción presente en los algoritmos tradicionales separando el proceso de convergencia en 2 redes neuronales independientes, una red en línea que procesa el estado del espectro para seleccionar la acción con el valor mas alto de recompensa proyectada y una red objetivo congelada que evalúa numéricamente dicha acción. En el entrenamiento una función de pérdida evalúa la diferencia cuadrática exacta entre las predicciones del modelo y los objetivos calculados la cual se minimiza con un optimizador estocástico adaptativo en base a la corrección de los momentos de los gradientes.
Para mejorar la eficiencia de la muestra el mecanismo PER (Prioritized Experience Replay) elimina la selección aleatoria de memorias y asigna prioridades probabilísticas a las transiciones basándose en la magnitud absoluta de su error de diferencia temporal que forza a la red neuronal a enfocar sus actualizaciones de pesos sinápticos en las fallas de predicción que sean más críticas.
Con el modelo estabilizado la secuencia de vectores n dimensionales resultantes se introduce directo en el componente PtrNet-LSTM para disminuir el problema de optimización conjunta en el espacio continuo, la capa celular LSTM (Long Short-Term Memory) actua como un codificador temporal que alimenta la topología de los nodos de decisión históricos configurando las fluctuaciones a largo plazo de la demanda de recursos físicos de la red, luego un decodificador utiliza un mecanismo de red de punteros que junto al cálculo de vectores atencionales y las transformaciones lineales de normalización exponencial genera una distribución de probabilidad sobre los nodos de entrada, esto permite a la arquitectura predecir las ráfagas de tráfico ajustando en tiempo de ejecución el coeficiente de atención multivariable y refinando la topología de la asignación de recursos que reduce la latencia y supera la ineficiencia de exploración de los métodos basados en la optimización del valor presente.`,
findings:`La arquitectura híbrida supera a modelos tradicionales de RL incluso en escenarios con alta congestión y varios usuarios conectados e igual al aumentar el número de terminales activos es decir que el sistema tuvo niveles estables de calidad del servicio y calidad de experiencia.
El coeficiente dinámico de atención es importante para equilibrar el rendimiento de los servicios eMBB y URLLC, la memoria secuencial permitió un aprendizaje más estable y una mejor adaptación a cambios en el tráfico de la red.`,
conclusions:`Se concluye que el RL y arquitecturas de memoria predictiva secuencial es una solución superlativa y con gran potencial de expansión para el aprovisionamiento organizado de recursos en topologías de network slicing inmersas en espectro radioeléctrico.
El marco de red desplaza y resuelve de modo automatico el problema de dicotomía entre maximizar el caudal de bits para el flujo masivo y proteger el determinismo milisegundo a milisegundo para escenarios telemáticos.`,
references:`Ali, R., Zikria, Y. B., Garg, S., Bashir, A. K., Obaidat, M. S., & Kim, H. S. (2021). A federated reinforcement learning framework for incumbent technologies in beyond 5G networks. IEEE Network, 35(4), 152–159. https://doi.org/10.1109/MNET.011.2000611`,
url:"https://ieeexplore.ieee.org/document/9520344"
            },
        ];

        // =================================================
        // DOM
    // =================================================

    const container =
    document.getElementById('papers-container');

const searchInput =
    document.getElementById('search-input');

const categoryFilter =
    document.getElementById('category-filter');

const countML =
    document.getElementById('count-ml');

const countDL =
    document.getElementById('count-dl');

const countFL =
    document.getElementById('count-fl');

const countRL =
    document.getElementById('count-rl');

const resultsCount =
    document.getElementById('results-count');

const subtitleText =
    document.getElementById('subtitle-text');

        // =================================================
    // ESTADOS
    // =================================================

    let expandedSet = new Set();

    let currentPage = 1;

    let papersPerPage = 10;

        // =================================================
    // CONTADORES
    // =================================================

    function updateCounters(){

    const mlCount =
        papersData.filter(
            p => p.category === 'Machine Learning'
        ).length;

    const dlCount =
        papersData.filter(
            p => p.category === 'Deep Learning'
        ).length;

    const flCount =
        papersData.filter(
            p => p.category === 'Federated Learning'
        ).length;

    const rlCount =
        papersData.filter(
            p => p.category === 'Reinforcement Learning'
        ).length;

    countML.textContent = mlCount;

    countDL.textContent = dlCount;

    countFL.textContent = flCount;

    countRL.textContent = rlCount;

        subtitleText.textContent =
            `Matriz analítica de ${papersData.length} artículos científicos relacionados con IA aplicada a redes 5G/6G.`;
    }

        // =================================================
    // CARD HTML
    // =================================================

    function createPaperHTML(paper){

        const isExpanded =
            expandedSet.has(paper.id);

        const expandedClass =
            isExpanded ? 'expanded' : '';

        return `

               <article class="group bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

                <!-- HEADER -->
                <div class="p-5 flex items-center justify-between cursor-pointer"
                    onclick="toggleRow(${paper.id})">

                    <div class="flex items-center gap-4">

                        <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-slate-500">

                            ${paper.id.toString().padStart(2,'0')}

                        </div>

                        <div>


                            <h2 class="text-lg font-semibold text-slate-900">

                                ${paper.title || 'Paper pendiente'}

                            </h2>

                            <div class="flex gap-2 mt-2 flex-wrap">

                                <span class="
                                    px-3 py-1 rounded-full text-xs font-bold border
    ${
        paper.category === 'Machine Learning'
        ? 'bg-blue-50 text-blue-700 border-blue-200'
        : paper.category === 'Deep Learning'
        ? 'bg-pink-50 text-indigo-700 border-pink-200'
        : paper.category === 'Federated Learning'
        ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
        : paper.category === 'Reinforcement Learning'
        ? 'bg-orange-50 text-orange-700 border-orange-200'
        : 'bg-slate-100 text-slate-700 border-slate-200'
    }
">

                                    ${paper.category || 'Categoria'}

                                </span>

                                <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">

                                    ${paper.aiTech || 'Tecnologia'}

                                </span>

                            </div>

                        </div>

                    </div>

                    <i data-lucide="chevron-down"
                        class="chevron-icon ${isExpanded ? 'expanded-icon' : ''}">
                    </i>

                </div>
                    <!-- CONTENT -->
                    <div class="card-content ${expandedClass}">

                        <div class="card-inner">

                            <div class="p-6 border-t border-slate-100">

                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

                                    <!-- PROBLEM -->
                                    <section class="bg-rose-50 rounded-xl p-4 border border-rose-100">

                                        <h3 class="text-xs font-bold uppercase tracking-widest text-rose-600 mb-2">

                                            Problemática

                                        </h3>

                                        <p class="text-sm text-slate-700">

                                            ${paper.problem}

                                        </p>

                                    </section>

                                    <!-- METHODOLOGY -->
                                    <section class="bg-slate-50 rounded-xl p-4 border border-slate-100">

                                        <h3 class="text-xs font-bold uppercase tracking-widest text-blue-600 mb-2">

                                            Metodología

                                        </h3>

                                        <p class="text-sm text-slate-700">

                                            ${paper.methodology}

                                        </p>

                                    </section>

                                    <!-- USO IA -->
                                    <section class="bg-emerald-50 rounded-xl p-4 border border-emerald-100">

                                        <h3 class="text-xs font-bold uppercase tracking-widest text-emerald-600 mb-2">

                                            Uso de IA

                                        </h3>

                                        <p class="text-sm text-slate-700">

                                            ${paper.aiUsage}

                                        </p>

                                    </section>

                                    <!-- HALLAZGOS -->
                                    <section class="bg-amber-50 rounded-xl p-4 border border-amber-100">

                                        <h3 class="text-xs font-bold uppercase tracking-widest text-amber-600 mb-2">

                                            Hallazgos Técnicos

                                        </h3>

                                        <p class="text-sm text-slate-700">

                                            ${paper.findings}

                                        </p>

                                    </section>

                                    <!-- CONCLUSIONS -->
                                    <div class="lg:col-span-2">

                                        <section class="bg-indigo-50 rounded-xl p-5 border border-indigo-100">

                                            <h3 class="text-xs font-bold uppercase tracking-widest text-indigo-700 mb-2">

                                                Conclusiones

                                            </h3>

                                            <p class="text-sm text-slate-800 mb-5">

                                                ${paper.conclusions}

                                            </p>

                                            <a href="${paper.url}"
                                                target="_blank"
                                                class="inline-flex items-center gap-2 px-5 py-3 bg-slate-900 hover:bg-black text-white rounded-xl text-sm font-semibold">

                                                Ver Documento

                                                <i data-lucide="external-link"
                                                    class="w-4 h-4">
                                                </i>

                                            </a>

                                        </section>

                                    </div>

                                    <!-- REFERENCIAS -->
                                    <div class="lg:col-span-2">

                                        <section class="bg-slate-50 rounded-xl p-5 border border-slate-200">

                                            <h3 class="text-xs font-bold uppercase tracking-widest text-slate-700 mb-4">

                                                Referencias Bibliográficas

                                            </h3>

                                            <div class="bg-white border border-slate-200 rounded-xl p-4">

                                                <p class="text-sm text-slate-700 leading-relaxed">

                                                    ${paper.references || 'Sin referencias.'}

                                                </p>

                                            </div>

                                        </section>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </article>

            `;
        }

        // =================================================
        // PAGINATION
        // =================================================

        function renderPagination(totalPages){

            const numbers =
                document.getElementById('pagination-numbers');

            const info =
                document.getElementById('pagination-info');

            numbers.innerHTML = '';

            info.textContent =
                `Página ${currentPage} de ${totalPages}`;

            for(let i=1; i<=totalPages; i++){

                const button =
                    document.createElement('button');

                button.textContent = i;

                button.className =
                    `
                    w-10 h-10 rounded-xl text-sm font-semibold
                    ${
                        currentPage === i
                        ? 'bg-slate-900 text-white'
                        : 'bg-slate-100 text-slate-700'
                    }
                    `;

                button.onclick = () => {

                    currentPage = i;

                    renderPapers();
                };

                numbers.appendChild(button);
            }
        }

        // =================================================
        // RENDER
        // =================================================

        function renderPapers(){

            const s =
                searchInput.value.toLowerCase();

            const cat =
                categoryFilter.value;

            const filtered =
                papersData.filter(paper => {

                    const matchesSearch =
                        paper.title.toLowerCase().includes(s)
                        ||
                        paper.problem.toLowerCase().includes(s)
                        ||
                        paper.aiTech.toLowerCase().includes(s);

                    const matchesCategory =
                        cat === "Todos"
                        ||
                        paper.category === cat;

                    return matchesSearch && matchesCategory;
                });

            resultsCount.textContent =
                `Mostrando ${filtered.length} resultados`;

            const totalPages =
                Math.ceil(filtered.length / papersPerPage);

            const start =
                (currentPage - 1) * papersPerPage;

            const end =
                start + papersPerPage;

            const paginated =
                filtered.slice(start, end);

            container.innerHTML =
                paginated.map(createPaperHTML).join('');

            renderPagination(totalPages);

            lucide.createIcons();
        }

        // =================================================
        // TOGGLE
        // =================================================

        window.toggleRow = function(id){

            if(expandedSet.has(id)){

                expandedSet.delete(id);

            }else{

                expandedSet.add(id);
            }

            renderPapers();
        }

        // =================================================
        // EVENTS
        // =================================================

        searchInput.addEventListener('input', () => {

            currentPage = 1;

            renderPapers();
        });

        categoryFilter.addEventListener('change', () => {

            currentPage = 1;

            renderPapers();
        });

        document.getElementById('prev-page')
        .addEventListener('click', () => {

            if(currentPage > 1){

                currentPage--;

                renderPapers();
            }
        });

        document.getElementById('next-page')
        .addEventListener('click', () => {

            const totalPages =
                Math.ceil(
                    papersData.length / papersPerPage
                );

            if(currentPage < totalPages){

                currentPage++;

                renderPapers();
            }
        });

        // =================================================
        // INIT
        // =================================================

        updateCounters();

        renderPapers();

    </script>

</body>

</html>
