                aiTech:"Neuronal Networks",
                problem:
    "Las bandas de ondas milimétricas presentan desafíos importantes para alcanzar niveles elevados de potencia de transmisión y mantener una adecuada calidad de señal debido a que las señales OFDM poseen una alta relación de potencia pico a promedio (PAPR), lo que degrada la eficiencia de los amplificadores de potencia. Aunque el estándar 5G utiliza la variante DFT-s-OFDM para reducir la PAPR y mejorar la cobertura, la señal continúa siendo vulnerable a la distorsión no lineal y al ruido de fase del oscilador cuando los amplificadores operan cerca de la saturación para maximizar potencia. Los receptores tradicionales basados en ecualizadores lineales presentan limitaciones importantes para detectar señales con altos niveles de distorsión, reduciendo el alcance y la confiabilidad en redes de próxima generación.",

methodology:
    "La metodología se desarrolló utilizando la plataforma 5G Toolbox de MATLAB, especializada en diseño y simulación de sistemas compatibles con estándares 3GPP. A través de esta herramienta se simuló un canal compartido físico de subida (PUSCH) bajo condiciones realistas en la banda de 28 GHz. Para la construcción del dataset se recolectaron 630,000 TTIs para entrenamiento y 170,000 TTIs para validación en distintos esquemas de modulación como QPSK, 64-QAM y 256-QAM. Se utilizaron modelos de Línea de Retardo Derivado (TDL) para representar entornos multipath, empleando los perfiles TDL-B, TDL-C y TDL-D durante el entrenamiento y TDL-A y TDL-E para validación. El sistema implementó redes neuronales convolucionales basadas en arquitecturas ResNet utilizando conexiones residuales para evitar degradación en el aprendizaje profundo. Se diseñaron dos variantes denominadas Light DFT-s CNN y Full DFT-s CNN, diferenciadas por la ubicación de las capas entrenables antes y después de la Transformada Discreta Inversa de Fourier (IDFT).",

aiUsage:
    "La investigación implementa Redes Neuronales Convolucionales (CNN) utilizando una arquitectura Residual Network (ResNet), la cual incorpora conexiones de salto para facilitar el entrenamiento de redes profundas y mejorar la estabilidad del aprendizaje. Se propusieron dos variantes principales: Light DFT-s CNN y Full DFT-s CNN. La arquitectura Full integra capas entrenables tanto antes como después de la Transformada Discreta Inversa de Fourier (IDFT), permitiendo realizar 64 transformadas paralelas dentro de la red neuronal para evitar cuellos de botella computacionales. Las capas previas a la IDFT facilitan la ecualización y mitigación de interferencia entre portadoras, mientras que las capas posteriores permiten compensar los efectos no lineales generados por los amplificadores RF. Este enfoque basado en Deep Learning permite mejorar significativamente la detección y recuperación de señales distorsionadas en escenarios mmWave.",

findings:

conclusions:

                aiTech:"Rgresion Lineal",
                problem:
    "La inestabilidad en los enlaces 5G mmWave es susceptible a fluctuaciones debido a su dependencia de la línea de vista. Las soluciones existentes basadas en DL presentan una complejidad computacional que genera retardos en la inferencia. Mientras un modelo de DL puede tardar 22 ms en un smartphone, el tiempo de coherencia del canal a 28 GHz para un usuario en movimiento es de solo 0.2 ms lo que invalida la predicción, La alta demanda de los modelos complejos es prohibitiva para dispositivos móviles con baterías limitadas que requieren muchos reentrenamientos.",

methodology:

aiUsage:

    "En los sistemas MU-MIMO que operan en la banda de 6 GHz existe una notable falta de optimización en los marcos de gestión y en las estrategias de retroalimentación. Los métodos tradicionales que emplean codebooks basados en la transformada discreta de Fourier para definir los pesos de formación de haces suelen resultar ineficientes en los entornos urbanos de alta dispersión característicos de estas frecuencias. Ante ello surge el desafío de unificar las distintas etapas de diseño de codebooks, barrido de haces, retroalimentación y transmisión de datos con el objetivo de maximizar la eficiencia espectral sin alterar los formatos estandarizados del 5G.",

        // =================================================

        const container =
            document.getElementById('papers-container');

            document.getElementById('count-ml');

            document.getElementById('results-count');

            document.getElementById('subtitle-text');

        // =================================================

        // =================================================

        let expandedSet = new Set();

        let currentPage = 1;

        let papersPerPage = 10;

        // =================================================
        // CONTADORES
        // =================================================

        function updateCounters(){

            const mlCount =
                papersData.filter(
                    p => p.category === 'Machine Learning'
                ).length;

            const dlCount =
                papersData.filter(
                    p => p.category === 'Deep Learning'
                ).length;

            countML.textContent = mlCount;

            countDL.textContent = dlCount;

            subtitleText.textContent =
                `Matriz analítica de ${papersData.length} artículos científicos relacionados con IA aplicada a redes 5G/6G.`;
        }

        // =================================================
        // CARD HTML
        // =================================================

        function createPaperHTML(paper){

            const isExpanded =
                expandedSet.has(paper.id);

            const expandedClass =
                isExpanded ? 'expanded' : '';

            return `

                <article class="group bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

                    <!-- HEADER -->
                    <div class="p-5 flex items-center justify-between cursor-pointer"
                        onclick="toggleRow(${paper.id})">

                        <div class="flex items-center gap-4">

                            <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-slate-500">

                                ${paper.id.toString().padStart(2,'0')}

                            </div>

                            <div>

                                <h2 class="text-lg font-semibold text-slate-900">

                                    ${paper.title || 'Paper pendiente'}

                                </h2>

                                <div class="flex gap-2 mt-2 flex-wrap">

                                    <span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200">

                                        ${paper.category || 'Categoria'}

                                    </span>

                                    <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">

                                        ${paper.aiTech || 'Tecnologia'}

                                    </span>

                                </div>

                            </div>

                        <i data-lucide="chevron-down"
                            class="chevron-icon ${isExpanded ? 'expanded-icon' : ''}">

                    <!-- CONTENT -->

                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

                                        <h3 class="text-xs font-bold uppercase tracking-widest text-rose-600 mb-2">

                                            Problemática

                                        </h3>

                                        <p class="text-sm text-slate-700">

                                            ${paper.problem}

                                        </p>

                                    </section>

                                    <!-- METHODOLOGY -->

                                        <h3 class="text-xs font-bold uppercase tracking-widest text-blue-600 mb-2">

                                            Metodología

                                        </h3>

                                        <p class="text-sm text-slate-700">

                                            ${paper.methodology}

                                        </p>

                                    </section>

                                    <!-- USO IA -->

                                        <h3 class="text-xs font-bold uppercase tracking-widest text-emerald-600 mb-2">

                                            Uso de IA

                                        </h3>

                                        <p class="text-sm text-slate-700">

                                            ${paper.aiUsage}

                                        </p>

                                    </section>

                                    <!-- HALLAZGOS -->

                                        <h3 class="text-xs font-bold uppercase tracking-widest text-amber-600 mb-2">

        // =================================================
        // PAGINATION
        // =================================================

        function renderPagination(totalPages){

            const numbers =
                document.getElementById('pagination-numbers');

            const info =
                document.getElementById('pagination-info');

            numbers.innerHTML = '';

            info.textContent =
                `Página ${currentPage} de ${totalPages}`;

            for(let i=1; i<=totalPages; i++){

                const button =
                    document.createElement('button');

                button.textContent = i;

                button.className =
                    `
                    w-10 h-10 rounded-xl text-sm font-semibold
                    ${
                        currentPage === i
                        ? 'bg-slate-900 text-white'
                        : 'bg-slate-100 text-slate-700'
                    }
                    `;

                button.onclick = () => {

                    currentPage = i;

                    renderPapers();
                };

                numbers.appendChild(button);
            }
        }

        // =================================================
        // RENDER
        // =================================================

        function renderPapers(){

            const s =
                searchInput.value.toLowerCase();

            const cat =
                categoryFilter.value;

            const filtered =
                papersData.filter(paper => {

                    const matchesSearch =
                        paper.title.toLowerCase().includes(s)
                        ||
                        paper.problem.toLowerCase().includes(s)
                        ||
                        paper.aiTech.toLowerCase().includes(s);

                    const matchesCategory =
                        cat === "Todos"
                        ||
                        paper.category === cat;

                    return matchesSearch && matchesCategory;
                });

            resultsCount.textContent =
                `Mostrando ${filtered.length} resultados`;

            const totalPages =
                Math.ceil(filtered.length / papersPerPage);

            const start =
                (currentPage - 1) * papersPerPage;

            const end =
                start + papersPerPage;

            const paginated =
                filtered.slice(start, end);

            container.innerHTML =
                paginated.map(createPaperHTML).join('');

            renderPagination(totalPages);

            lucide.createIcons();
        }

        // =================================================
        // TOGGLE
        // =================================================

        window.toggleRow = function(id){

            if(expandedSet.has(id)){

                expandedSet.delete(id);

            }else{

                expandedSet.add(id);
            }

            renderPapers();
        }

        // =================================================
        // EVENTS
        // =================================================

        searchInput.addEventListener('input', () => {

            currentPage = 1;

            renderPapers();
        });

        categoryFilter.addEventListener('change', () => {

            currentPage = 1;

            renderPapers();
        });

        document.getElementById('prev-page')
        .addEventListener('click', () => {

            if(currentPage > 1){

                currentPage--;

                renderPapers();
            }
        });

        document.getElementById('next-page')
        .addEventListener('click', () => {

            const totalPages =
                Math.ceil(
                    papersData.length / papersPerPage
                );

            if(currentPage < totalPages){

                currentPage++;

                renderPapers();
            }
        });

        // =================================================
        // INIT
        // =================================================

        updateCounters();

        renderPapers();

    </script>
